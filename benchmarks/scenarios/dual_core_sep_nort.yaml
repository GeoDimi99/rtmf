# Benchmark scenario (RTMO DSL 0.1), converted from benchmarks/golden/dual_core_sep_nort/legacy.yaml.
# benchmarks/run-campaign.sh overrides deployment.coordination/technology and
# schedule.iterations for every implementation and run.
version: '0.1'
deployment:
  coordination: orchestration
  technology: mqueue
  registry: jeffadac/realtime-microservices
  control_cpu: 4
  task_cpus: '5'
images:
- name: stress_task_1
  src: ../tasks/stress_task_1
- name: stress_task_2
  src: ../tasks/stress_task_2
- name: stress_task_3
  src: ../tasks/stress_task_3
- name: stress_task_4
  src: ../tasks/stress_task_4
- name: stress_task_5
  src: ../tasks/stress_task_5
- name: stress_task_6
  src: ../tasks/stress_task_6
schedule:
  name: Configurable CPU/IO Benchmark
  description: Benchmark with configurable CPU/IO ratio using total_ops and io_percentage parameters
  iterations: 100
  time_unit: ms
  tasks:
  - id: 1
    image: stress_task_1
    start: 50
    deadline: 650
    cpu_affinity: 5
    policy: normal
    priority: -1
    depends_on: []
    inputs:
      total_ops:
        type: int
        value: 17
      io_percentage:
        type: int
        value: 0
    outputs:
      result:
        type: int
  - id: 2
    image: stress_task_2
    start: 300
    deadline: 1300
    cpu_affinity: 5
    policy: normal
    priority: -1
    depends_on: []
    inputs:
      total_ops:
        type: int
        value: 17
      io_percentage:
        type: int
        value: 0
    outputs:
      result:
        type: int
  - id: 3
    image: stress_task_3
    start: 350
    deadline: 950
    cpu_affinity: 5
    policy: normal
    priority: -8
    depends_on: []
    inputs:
      total_ops:
        type: int
        value: 17
      io_percentage:
        type: int
        value: 0
    outputs:
      result:
        type: int
  - id: 4
    image: stress_task_4
    start: 370
    deadline: 970
    cpu_affinity: 5
    policy: normal
    priority: -4
    depends_on: []
    inputs:
      total_ops:
        type: int
        value: 17
      io_percentage:
        type: int
        value: 0
    outputs:
      result:
        type: int
  - id: 5
    image: stress_task_5
    start: 600
    deadline: 1200
    cpu_affinity: 5
    policy: normal
    priority: -4
    depends_on: []
    inputs:
      total_ops:
        type: int
        value: 17
      io_percentage:
        type: int
        value: 0
    outputs:
      result:
        type: int
  - id: 6
    image: stress_task_6
    start: 650
    deadline: 1250
    cpu_affinity: 5
    policy: normal
    priority: -4
    depends_on: []
    inputs:
      total_ops:
        type: int
        value: 17
      io_percentage:
        type: int
        value: 0
    outputs:
      result:
        type: int
