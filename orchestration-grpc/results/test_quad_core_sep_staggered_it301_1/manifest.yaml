version: "1.0"

images:
  base: "rtmf/task-wrapper:orchestration-grpc"
  repo: "jeffadac/realtime-microservices"
  tasks:
    - alias: "stress_task_1"
      src: "stress_task_1"
    - alias: "stress_task_2"
      src: "stress_task_2"
    - alias: "stress_task_3"
      src: "stress_task_3"
    - alias: "stress_task_4"
      src: "stress_task_4"
    - alias: "stress_task_5"
      src: "stress_task_5"
    - alias: "stress_task_6"
      src: "stress_task_6"

schedule:
  name: "Configurable CPU/IO Benchmark"
  description: "Benchmark with configurable CPU/IO ratio using total_ops and io_percentage parameters"
  iterations: 301
  
  # Variant of quad_core_sep with the cores started one after the other:
  #   core 5: +0 ms
  #   core 6: +255 ms  (its first task starts at 305 ms, right after task 2 of core 5 at 300 ms)
  #   core 7: +510 ms  (its first task starts at 560 ms, right after task 8 of core 6 at 555 ms)
  # Start and deadline are shifted alike, so every task keeps the same window;
  # priorities, policy and inputs unchanged. All 18 activations are at different instants.

  tasks:
    # ===================== CORE 5 =====================
    - id: 1
      image: "stress_task_1"
      start: 50
      deadline: 650
      cpu_affinity: 5
      policy: "fifo"
      priority: 50
      depends_on: []
      inputs:
        total_ops:
          type: int
          value: 16
        io_percentage:
          type: int
          value: 0
      outputs:
        result:
          type: int

    - id: 2
