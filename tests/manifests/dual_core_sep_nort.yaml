version: "1.0"

images:
  base: "rtmf/task-wrapper:orchestration-grpc"
  repo: "jeffadac/realtime-microservices"
  tasks:
    - alias: "stress_task_1"
      src: "stress_task_1"
    - alias: "stress_task_2"
      src: "stress_task_2"
    - alias: "stress_task_3"
      src: "stress_task_3"
    - alias: "stress_task_4"
      src: "stress_task_4"
    - alias: "stress_task_5"
      src: "stress_task_5"
    - alias: "stress_task_6"
      src: "stress_task_6"

schedule:
  name: "Configurable CPU/IO Benchmark"
  description: "Benchmark with configurable CPU/IO ratio using total_ops and io_percentage parameters"
  iterations: 100
  
  # Non real-time version of dual_core_sep (same plan, SCHED_OTHER).
  # Under SCHED_OTHER the static RT priority must be 0, so the "priority"
  # field here is interpreted as the nice value (-20..19, lower = higher prio).
  # Same mapping as single_core_nort (RT range [1, 99] onto nice [19, -20]):
  #   nice = 19 - (rt_prio - 1) * 39 / 98   (rounded; ties toward higher prio)
  #   RT 70 (task 3)        -> nice -8
  #   RT 60 (tasks 4, 5, 6) -> nice -4
  #   RT 50 (tasks 1, 2)    -> nice -1

  tasks:
    # Pure CPU workload
    - id: 1
      image: "stress_task_1"
      start: 50
      deadline: 650
      cpu_affinity: 5
      policy: "normal"
      priority: -1       # RT 50 -> nice -1
      depends_on: []
      inputs:
        total_ops:
          type: int
          value: 17
        io_percentage:
          type: int
          value: 0      
      outputs:
        result:
          type: int

    - id: 2
      image: "stress_task_2"
      start: 300
      deadline: 1300
      cpu_affinity: 5
      policy: "normal"
      priority: -1       # RT 50 -> nice -1
      depends_on: []
      inputs:
        total_ops:
          type: int
          value: 17
        io_percentage:
          type: int
          value: 0      
      outputs:
        result:
          type: int


    - id: 3
      image: "stress_task_3"
      start: 350
      deadline: 950
      cpu_affinity: 5
      policy: "normal"
      priority: -8       # RT 70 -> nice -8
      depends_on: []
      inputs:
        total_ops:
          type: int
          value: 17
        io_percentage:
          type: int
          value: 0      
      outputs:
        result:
          type: int

    - id: 4
      image: "stress_task_4"
      start: 370
      deadline: 970
      cpu_affinity: 5
      policy: "normal"
      priority: -4       # RT 60 -> nice -4
      depends_on: []
      inputs:
        total_ops:
          type: int
          value: 17
        io_percentage:
          type: int
          value: 0      
      outputs:
        result:
          type: int


    - id: 5
      image: "stress_task_5"
      start: 600
      deadline: 1200
      cpu_affinity: 5
      policy: "normal"
      priority: -4       # RT 60 -> nice -4
      depends_on: []
      inputs:
        total_ops:
          type: int
          value: 17
        io_percentage:
          type: int
          value: 0      
      outputs:
        result:
          type: int



    - id: 6
      image: "stress_task_6"
      start: 650
      deadline: 1250
      cpu_affinity: 5
      policy: "normal"
      priority: -4       # RT 60 -> nice -4
      depends_on: []
      inputs:
        total_ops:
          type: int
          value: 17
        io_percentage:
          type: int
          value: 0      
      outputs:
        result:
          type: int