version: "1.0"

images:
  base: "rtmo/task-wrapper:orchestration-grpc"
  repo: "jeffadac/realtime-microservices"
  tasks:
    - alias: "stress_task_1"
      src: "stress_task_1"
    - alias: "stress_task_2"
      src: "stress_task_2"
    - alias: "stress_task_3"
      src: "stress_task_3"
    - alias: "stress_task_4"
      src: "stress_task_4"
    - alias: "stress_task_5"
      src: "stress_task_5"
    - alias: "stress_task_6"
      src: "stress_task_6"

schedule:
  name: "Configurable CPU/IO Benchmark"
  description: "Benchmark with configurable CPU/IO ratio using total_ops and io_percentage parameters"
  iterations: 100
  
  # Variant of quad_core_sep: the tasks of cores 6 and 7 are shifted in time so that
  # all 18 activations (and completions) happen at different instants:
  #   core 5: +0 ms   core 6: +5 ms   core 7: +15 ms   (start and deadline shifted alike,
  #   so every task keeps the same window; priorities, policy and inputs unchanged).

  tasks:
    # ===================== CORE 5 =====================
    - id: 1
      image: "stress_task_1"
      start: 50
      deadline: 650
      cpu_affinity: 5
      policy: "fifo"
      priority: 50
      depends_on: []
      inputs:
        total_ops:
          type: int
          value: 16
        io_percentage:
          type: int
          value: 0
      outputs:
        result:
          type: int

